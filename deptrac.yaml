deptrac:
  paths:
    - ./src/
    - ./vendor/codeigniter4/framework/system/
    - ./vendor/codeigniter4/settings/src/
  exclude_files:
    - '#.*test.*#i'
  layers:
    - name: Model
      collectors:
        - type: bool
          must:
          - type: classLike
            value: .*[A-Za-z]+Model$
          must_not:
          - type: directory
            value: vendor/.*
    - name: Vendor Model
      collectors:
        - type: bool
          must:
          - type: classLike
            value: .*[A-Za-z]+Model$
          - type: directory
            value: vendor/.*
    - name: Controller
      collectors:
        - type: bool
          must:
          - type: classLike
            value: .*\/Controllers\/.*
          must_not:
          - type: directory
            value: vendor/.*
    - name: Vendor Controller
      collectors:
        - type: bool
          must:
          - type: classLike
            value: .*\/Controllers\/.*
          - type: directory
            value: vendor/.*
    - name: Config
      collectors:
        - type: bool
          must:
          - type: directory
            value: src/Config/.*
          must_not:
          - type: classLike
            value: .*Services
          - type: directory
            value: vendor/.*
    - name: Vendor Config
      collectors:
        - type: bool
          must:
          - type: directory
            value: vendor/.*/Config/.*
          must_not:
          - type: classLike
            value: .*Services
    - name: Entity
      collectors:
        - type: bool
          must:
          - type: directory
            value: src/Entities/.*
          must_not:
          - type: directory
            value: vendor/.*
    - name: Vendor Entity
      collectors:
        - type: bool
          must:
          - type: directory
            value: vendor/.*/Entities/.*
    - name: View
      collectors:
        - type: bool
          must:
          - type: directory
            value: src/Views/.*
          must_not:
          - type: directory
            value: vendor/.*
    - name: Vendor View
      collectors:
        - type: bool
          must:
          - type: directory
            value: vendor/.*/Views/.*
    - name: Service
      collectors:
        - type: classLike
          value: .*Services.*
    # The shared field system. Modules such as Content build on it, so it can't depend on any of them.
    - name: Fields
      collectors:
        - type: classLike
          value: ^Bonfire\\Fields\\.*
    - name: Content
      collectors:
        - type: bool
          must:
          - type: classLike
            value: ^Bonfire\\Content\\.*
          must_not:
          - type: classLike
            value: .*[A-Za-z]+Model$
  ruleset:
    # Fields may use itself and the framework, and nothing else of Bonfire's, which keeps Content out of it.
    Fields:
      - Fields
      - Vendor Config
    Content:
      - Content
      - Fields
      - Config
      - Entity
      - Model
      - Service
      - Vendor Config
      - Vendor Controller
      - Vendor Entity
      - Vendor Model
      - Vendor View
    Entity:
      - Config
      - Model
      - Service
      - Vendor Config
      - Vendor Entity
      - Vendor Model
    Config:
      - Content
      - Model
      - Service
      - Vendor Config
    Model:
      - Config
      - Content
      - Entity
      - Service
      - Vendor Config
      - Vendor Entity
      - Vendor Model
    Service:
      - Config
      - Vendor Config

    # Ignore anything in the Vendor layers
    Vendor Model:
      - Config
      - Service
      - Vendor Config
      - Vendor Controller
      - Vendor Entity
      - Vendor Model
      - Vendor View
    Vendor Controller:
      - Service
      - Vendor Config
      - Vendor Controller
      - Vendor Entity
      - Vendor Model
      - Vendor View
    Vendor Config:
      - Config
      - Service
      - Vendor Config
      - Vendor Controller
      - Vendor Entity
      - Vendor Model
      - Vendor View
    Vendor Entity:
      - Service
      - Vendor Config
      - Vendor Controller
      - Vendor Entity
      - Vendor Model
      - Vendor View
    Vendor View:
      - Service
      - Vendor Config
      - Vendor Controller
      - Vendor Entity
      - Vendor Model
      - Vendor View
  skip_violations:
